services:
  api:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3

  dashboard:
    build: .
    command: streamlit run src/industrial_defect_detection/streamlit_app.py --server.address 0.0.0.0 --server.port 8501
    env_file: .env
    ports:
      - "8501:8501"
    volumes:
      - ./models:/app/models:ro
    depends_on:
      api:
        condition: service_started

