services:
  api:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models:ro

  dashboard:
    build: .
    command: streamlit run src/industrial_defect_detection/streamlit_app.py --server.address 0.0.0.0 --server.port 8501
    env_file: .env
    ports:
      - "8501:8501"
    volumes:
      - ./models:/app/models:ro
    depends_on:
      api:
        condition: service_started

