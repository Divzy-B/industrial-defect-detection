[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "industrial-defect-detection"
version = "0.1.1"
description = "YOLOv8-based industrial surface-defect detection API and dashboard"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
authors = [{ name = "Divzy-B" }]
dependencies = [
  "fastapi>=0.115,<0.116",
  "uvicorn[standard]>=0.30,<1.0",
  "python-multipart>=0.0.9,<1.0",
  "numpy>=1.26,<3.0",
  "opencv-python-headless>=4.10,<5.0",
]

[project.optional-dependencies]
model = [
  "torch>=2.4,<3.0",
  "ultralytics>=8.3,<9.0",
  "onnxruntime>=1.19,<2.0",
]
dashboard = [
  "streamlit>=1.39,<2.0",
]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.3,<9.0",
  "ruff>=0.8,<1.0",
]
all = [
  "torch>=2.4,<3.0",
  "ultralytics>=8.3,<9.0",
  "onnxruntime>=1.19,<2.0",
  "streamlit>=1.39,<2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI inspects these declaration-time objects to build its OpenAPI schema.
extend-immutable-calls = ["fastapi.File", "fastapi.Query"]

